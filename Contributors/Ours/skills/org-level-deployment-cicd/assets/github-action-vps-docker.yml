name: Deploy Application to VPS (Docker)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/{{APP_DIVISION}}/{{APP_NAME}}/**'
      - 'packages/**'
  tags:
    - '{{APP_NAME}}@v*'
  workflow_dispatch:

concurrency:
  group: deploy-{{APP_NAME}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy {{APP_NAME}}
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref, 'refs/tags/') && 'production' || 'development' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/{{APP_DIVISION}}/{{APP_NAME}}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/{{APP_NAME}}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/{{APP_NAME}}:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Deploying {{APP_NAME}} on VPS..."
            cd /var/www/apps/{{APP_NAME}} || exit 1
            docker pull ghcr.io/${{ github.repository }}/{{APP_NAME}}:latest
            docker compose up -d --remove-orphans
            docker system prune -f

      - name: Verify Health Check
        run: |
          echo "Verifying service health..."
          curl --fail --retry 5 --retry-delay 5 https://{{APP_NAME}}.domain.com/health || exit 1
