name: Deploy Application to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'apps/{{APP_DIVISION}}/{{APP_NAME}}/**'
      - 'packages/**'
  tags:
    - '{{APP_NAME}}@v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ contains(github.ref, 'refs/tags/') && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./apps/{{APP_DIVISION}}/{{APP_NAME}}

      - name: Build Project Artifacts
        run: vercel build ${{ contains(github.ref, 'refs/tags/') && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./apps/{{APP_DIVISION}}/{{APP_NAME}}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt ${{ contains(github.ref, 'refs/tags/') && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./apps/{{APP_DIVISION}}/{{APP_NAME}}
