name: Validate Ground-Truth & Symlinks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Ground-Truth Audit & Link Check
        run: |
          chmod +x ./warehouse
          ./warehouse audit
          ./warehouse status
